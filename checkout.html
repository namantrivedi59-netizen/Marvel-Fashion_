<main class="shop-page">
  <div class="shop-header">
    <p class="shop-eyebrow">Step 1 of 3</p>
    <h1 class="shop-title">Checkout</h1>
    <p class="shop-subtitle">Tell us where your gear should land.</p>
  </div>

  <div class="checkout-layout">
    <div class="checkout-form-card">
      <h2>Contact &amp; Shipping</h2>

      <div class="input-group">
        <label for="checkout_email">Email</label>
        <div class="input-shell"><input type="email" id="checkout_email" placeholder="you@example.com" autocomplete="email"></div>
        <span class="field-error" id="checkout_emailError"></span>
      </div>

      <div class="address-book-section">
        <div class="address-book-header">
          <h3>Saved Addresses</h3>
          <button type="button" class="btn-ghost-sm" id="addNewAddressBtn" style="flex:none;">+ Add New Address</button>
        </div>
        <div class="address-list" id="addressList"><!-- rendered by js/checkout.js --></div>
        <p class="address-empty-note" id="addressEmptyNote" hidden>No saved addresses yet — add one below.</p>
      </div>

      <form id="addressForm" class="address-form" novalidate hidden>
        <input type="hidden" id="addressForm_editId" value="">
        <div class="input-group">
          <label for="checkout_fullName">Full Name</label>
          <div class="input-shell"><input type="text" id="checkout_fullName" placeholder="Your full name" autocomplete="name"></div>
          <span class="field-error" id="checkout_fullNameError"></span>
        </div>

        <div class="input-group">
          <label for="checkout_phone">Phone Number</label>
          <div class="input-shell"><input type="tel" id="checkout_phone" placeholder="+1 555 123 4567" autocomplete="tel"></div>
          <span class="field-error" id="checkout_phoneError"></span>
        </div>

        <div class="input-group">
          <label for="checkout_address">Address</label>
          <div class="input-shell"><input type="text" id="checkout_address" placeholder="Street address" autocomplete="street-address"></div>
          <span class="field-error" id="checkout_addressError"></span>
        </div>

        <div class="checkout-grid-2">
          <div class="input-group">
            <label for="checkout_city">City</label>
            <div class="input-shell"><input type="text" id="checkout_city" placeholder="City" autocomplete="address-level2"></div>
            <span class="field-error" id="checkout_cityError"></span>
          </div>
          <div class="input-group">
            <label for="checkout_state">State</label>
            <div class="input-shell"><input type="text" id="checkout_state" placeholder="State" autocomplete="address-level1"></div>
            <span class="field-error" id="checkout_stateError"></span>
          </div>
        </div>

        <div class="input-group">
          <label for="checkout_zip">ZIP Code</label>
          <div class="input-shell"><input type="text" id="checkout_zip" placeholder="ZIP / Postal code" autocomplete="postal-code"></div>
          <span class="field-error" id="checkout_zipError"></span>
        </div>

        <div class="address-form-actions">
          <button type="submit" class="btn-solid-sm" id="saveAddressBtn" style="flex:none; padding: 10px 22px;">Save Address</button>
          <button type="button" class="btn-ghost-sm" id="cancelAddressBtn" style="flex:none; padding: 10px 22px;">Cancel</button>
        </div>
      </form>

      <span class="field-error" id="checkout_selectionError"></span>
      <button type="button" class="auth-submit" id="checkoutSubmit" style="margin-top: 22px;">Continue To Order Review</button>
    </div>

    <aside class="summary-card">
      <h2 class="summary-title">Order Summary</h2>
      <div id="checkoutItems"></div>
      <div id="checkoutTotals" style="margin-top: 18px;">
        <div class="summary-row"><span>Subtotal</span><span data-subtotal>$0.00</span></div>
        <div class="summary-row summary-discount"><span>Discount</span><span data-discount>-$0.00</span></div>
        <div class="summary-row"><span>Shipping</span><span data-shipping>Free</span></div>
        <div class="summary-row"><span>Tax</span><span data-tax>$0.00</span></div>
        <div class="summary-row summary-total"><span>Total</span><span data-total>$0.00</span></div>
      </div>
    </aside>
  </div>
</main>
